[project]
name = "actual-transaction-email-splitter"
version = "2026.5.2"
description = "Parse forwarded order-confirmation emails into split transactions in Actual Budget."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jay Miller" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "actualpy>=0.9",
    "prometheus-client>=0.21",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actual_tx_splitter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
